name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wal_impl: [wal, handoff]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        # Use official bun installer; this step will install Bun into $HOME/.bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s -- -y
          echo "export PATH=\"$HOME/.bun/bin:$PATH\"" >> $GITHUB_ENV

      - name: Install dependencies
        run: bun install

      - name: Run tests (matrix WAL_IMPL)
        env:
          WAL_IMPL: ${{ matrix.wal_impl }}
        run: |
          echo "Running tests with WAL_IMPL=$WAL_IMPL"
          bun test
