name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wal_impl: [wal, handoff]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        # Use official bun installer; this step will install Bun into $HOME/.bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s -- -y
          echo "export PATH=\"$HOME/.bun/bin:$PATH\"" >> $GITHUB_ENV

      - name: Install dependencies
        run: bun install

      - name: Build (TypeScript)
        run: bun x tsc -p tsconfig.json || npm run build

      - name: Typecheck
        run: bun x tsc --noEmit || npm run typecheck

      - name: Run tests (matrix WAL_IMPL)
        env:
          WAL_IMPL: ${{ matrix.wal_impl }}
        run: |
          echo "Running tests with WAL_IMPL=$WAL_IMPL"
          bun test

      - name: Archive test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            ./data
