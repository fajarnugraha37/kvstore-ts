name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "::add-path::${HOME}/.bun/bin"
      - name: Install deps
        run: bun install
      - name: Run tests
        run: npm run ci

  bench:
    if: env.RUN_BENCH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "::add-path::${HOME}/.bun/bin"
      - name: Install deps
        run: bun install
      - name: Run bench
        run: npm run bench
